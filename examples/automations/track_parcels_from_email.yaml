# Extract Danske Fragtmænd tracking links from incoming e-mail and register them
# with `danske_fragtmaend.track_parcel`, so consignments start tracking the
# moment the carrier's mail lands in your inbox — no manual entry.
#
# Requirements:
#   - one or more core IMAP config entries with "text" enabled under
#     "message data" and the max message size raised (carrier mails are
#     long) — full setup guide and pitfalls: track_parcels_from_email.md
#   - optional: an `ai_task` entity for the AI fallback branch; delete
#     the whole `else:` block if you don't use one
#   - PRIVACY: by default this fires on EVERY incoming mail and (with the
#     AI branch) can send mail bodies to your AI Task. Scope the IMAP
#     search to the carrier's sender first — see "Scope & privacy" in the .md.
#
# The regex is deliberately written without backslashes (`[.]` instead of
# `\.`, `[0-9]` instead of `\d`): Jinja treats `\b` and friends inside a
# string literal as escapes, so the pattern would silently never match.

alias: "Danske Fragtmænd: track from e-mail"
description: >-
  Listens to imap_content events from all IMAP entries. Fast regex path for
  Danske Fragtmænd tracking links; optional AI fallback for mails whose layout the
  regex does not recognise.
mode: queued
max: 10

triggers:
  - trigger: event
    event_type: imap_content

variables:
  sender: "{{ trigger.event.data.sender | default('') | lower }}"
  subject: "{{ trigger.event.data.subject | default('') }}"
  body: "{{ trigger.event.data.text | default('') }}"
  content: "{{ subject ~ ' ' ~ body }}"
  # The carrier's mails carry a tracking link with the consignment number and
  # its key. Only whole links are taken: the key in them gives the full
  # record, and a bare number found next to a link would replace it.
  danske_fragtmaend_codes: >-
    {{ content
       | regex_findall('trace[.]fragt[.]dk/#/trackTrace/[0-9A-Za-z]+(?:/[0-9A-Za-z]+)?')
       | unique | list }}
  # Keyword gate for the AI fallback — localise to your language(s).
  is_parcel_mail: >-
    {{ content | lower is search('package|shipped|out for delivery|track|shipment|delivery') }}

conditions:
  # initial=true means "new message"; false means a duplicate trigger of
  # the SAME message (e.g. after a reconnect) — requiring it is free dedup.
  - condition: template
    value_template: "{{ trigger.event.data.initial | default(true) }}"
  - condition: template
    value_template: "{{ is_parcel_mail or danske_fragtmaend_codes | count > 0 }}"

actions:
  - repeat:
      for_each: "{{ danske_fragtmaend_codes }}"
      sequence:
        - action: danske_fragtmaend.track_parcel
          data:
            tracking_code: "{{ repeat.item }}"
  - if:
      - condition: template
        value_template: "{{ danske_fragtmaend_codes | count > 0 }}"
    then:
      - action: notify.mobile_app_your_phone
        data:
          title: "📦 Danske Fragtmænd parcel picked up from mail"
          # The links carry the access key; the notification only counts them.
          message: >-
            {{ danske_fragtmaend_codes | count }} consignment(s) (mail from {{ sender }})
    else:
      # ---- Optional AI fallback — delete this block if you have no ai_task entity ----
      - action: ai_task.generate_data
        data:
          task_name: danske_fragtmaend-tracking-code-extraction
          entity_id: ai_task.your_ai_task_entity
          instructions: >-
            Below is an e-mail. Determine whether it contains a Danske Fragtmænd
            consignment number (fragtbrevsnummer). Danske Fragtmænd numbers
            are uppercase letters and digits, for example starting
            with FD. Only return a real consignment number, never an order,
            customer or invoice number. If the mail is from a different
            carrier, answer 'other'. When in doubt: 'none'.

            Sender: {{ sender }}
            Subject: {{ subject }}
            Body:
            {{ body[:6000] }}
          structure:
            carrier:
              description: Whether a Danske Fragtmænd tracking code was found
              required: true
              selector:
                select:
                  options: ["danske_fragtmaend", "other", "none"]
            tracking_code:
              description: The tracking code, or empty if none
              required: false
              selector:
                text:
        response_variable: ai_result
      - choose:
          - conditions: "{{ ai_result.data.carrier == 'danske_fragtmaend' and (ai_result.data.tracking_code | default('') | trim) != '' }}"
            sequence:
              - action: danske_fragtmaend.track_parcel
                data:
                  tracking_code: "{{ ai_result.data.tracking_code | trim }}"
              - action: notify.mobile_app_your_phone
                data:
                  title: "📦 Danske Fragtmænd parcel picked up from mail (AI)"
                  message: "{{ ai_result.data.tracking_code | trim }} (mail from {{ sender }})"
          - conditions: "{{ ai_result.data.carrier == 'other' and (ai_result.data.tracking_code | default('') | trim) != '' }}"
            sequence:
              - action: notify.mobile_app_your_phone
                data:
                  title: "📦 Tracking number found – not a Danske Fragtmænd parcel"
                  message: "{{ ai_result.data.tracking_code | trim }} (mail from {{ sender }}, subject: {{ subject }})"
